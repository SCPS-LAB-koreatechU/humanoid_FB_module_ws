# 구성 A: 전체 장착. port = <장착된 인스턴스>.<포트 이름>
base: {module: torso_bhl, id: torso}
attach:
  - {port: torso.S_R, module: arm_bhl, id: r_arm, host: control_pc}
  - {port: r_arm.flange, module: connector_d84, id: r_conn}
  - {port: r_conn.hand, module: hand_dexhand_v1, id: r_hand, host: control_pc}
  - {port: torso.S_L, module: arm_bhl, id: l_arm, host: control_pc}
  - {port: l_arm.flange, module: connector_d84, id: l_conn}
  - {port: l_conn.hand, module: hand_dexhand_v1, id: l_hand, host: control_pc}
  - {port: torso.N, module: neck_pan_tilt_scs, id: neck, host: control_pc}
  - {port: neck.mount, module: head_zed2i, id: head, host: control_pc}
