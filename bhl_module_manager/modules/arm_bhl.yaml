# BHL 팔 모듈 (5자유도). 표준 DH: A_i = Rz(theta_i) Tz(d_i) Tx(a_i) Rx(alpha_i), theta_i = q_i + theta0_i
# 나누는 기준: 구조가 정하는 값은 기계(DH, 기구 범위, 질량), 구동기나 소프트웨어가 정하는 값은 제어(주기, 토크, 속도, 소프트 한계, 영점).
# BHL URDF(berkeley_humanoid_lite.urdf)에서 유도, 관절 범위 안 무작위 2000자세에서 URDF 순기구학과 일치 확인.
# 모듈 기준 좌표계(DH {0}) = 어깨 포트, 도구 좌표계 F(DH {5}) = 팔꿈치 롤 출력면 = URDF hand 좌표계 원점.
id: arm_bhl
name: BHL 팔 모듈
kind: arm
sides: [R, L]
fb:
  mechanical:
    mates_with: shoulder_bhl
    mass_kg: 1.560              # BHL URDF 링크 질량 합 (어깨 피치 ~ 팔꿈치 롤)
    kinematics:
      type: dh_standard
      length_unit: mm
      angle_unit: deg
      joints:                   # range = 기구 범위 (deg), BHL URDF 관절 한계값을 그대로 사용 (실측 스토퍼 미확인)
        R:
          - {hw: arm_right_shoulder_pitch_joint, a: 0, alpha: 90, d: 43,  theta0: 90,   range: [-45, 90]}
          - {hw: arm_right_shoulder_roll_joint,  a: 0, alpha: 90, d: 0,   theta0: -105, range: [-75, 15]}
          - {hw: arm_right_shoulder_yaw_joint,   a: 0, alpha: 90, d: 166, theta0: 90,   range: [-45, 45]}
          - {hw: arm_right_elbow_pitch_joint,    a: 0, alpha: 90, d: -1,  theta0: -180, range: [-90, 0]}
          - {hw: arm_right_elbow_roll_joint,     a: 0, alpha: 0,  d: 123, theta0: 180,  range: [-45, 45]}
        L:
          - {hw: arm_left_shoulder_pitch_joint,  a: 0, alpha: 90, d: 43,  theta0: 90,   range: [-90, 45]}
          - {hw: arm_left_shoulder_roll_joint,   a: 0, alpha: 90, d: 0,   theta0: 105,  range: [-15, 75]}
          - {hw: arm_left_shoulder_yaw_joint,    a: 0, alpha: 90, d: 166, theta0: -90,  range: [-45, 45]}
          - {hw: arm_left_elbow_pitch_joint,     a: 0, alpha: 90, d: -1,  theta0: -180, range: [0, 90]}
          - {hw: arm_left_elbow_roll_joint,      a: 0, alpha: 0,  d: 123, theta0: 0,    range: [-45, 45]}
    frames:
      F: {at: dh5}              # 플랜지 = DH {5}  (주의: YAML에서 on은 불리언이라 at을 씀)
    ports:
      - {name: flange, type: elbow_flange_bhl, frame: F}
  electrical:
    bus: can
    bitrate: 1000000
    ids: null                   # 실제 액추에이터 CAN ID를 넣으면 충돌 검사에 쓰임
    host_requirements: {can: true}
  control:
    rate_hz: 250
    effort: 20                  # N m, URDF limit effort
    velocity: 15                # rad/s, URDF limit velocity
    soft_limits: {}             # 비우면 기구 범위를 그대로 사용, 예: {arm_right_elbow_pitch_joint: [-85, -5]}
    zero_offset: {}             # 액추에이터 엔코더 값과 q = 0의 대응 (캘리브레이션 후 기입)
  functional:
    skills:
      - name: "wave({side}_arm)"
        requires: {frames: [F]}
      - name: "handshake({side}_arm, {side}_hand)"
        requires: {frames: [F], capabilities: ["open_hand({side}_hand)"]}
